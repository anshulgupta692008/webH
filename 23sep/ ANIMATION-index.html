<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 div{
        height:300px;
        width: 400px;
        background-color: rgb(49, 234, 20);
        margin: 50px auto;
    }
    div:hover{
        animation-name: anshul;
        animation-duration: 1s;
        animation-delay: 0s;
        animation-iteration-count: 55;
    }
    @keyframes anshul{
        0%{
            background-color: goldenrod
            
        }
         10%{
            background-color:rgb(240, 243, 36) ;
            width: 60%;
        } 25%{
            background-color: rgb(183, 227, 10);
            min-height:60%;
            height: 100px;
        } 50%{
            background-color: rgb(178, 237, 13);
            height: 500vh;
        }100%{
            background-color: rgb(225, 245, 12);
        }
    }
    </style>
   
</head>
<body>
    <div></div>
</body>
</html>
