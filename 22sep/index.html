<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
    #parent{
        height: 500px;
        width: 1000px;
        border: solid;
      }
      .oo{
        height: 100px;
        width: 100px;
        transition-duration: 3s;
      }
      #parent:hover .oo{
       margin-left:900px;
       /* border-radius: 50%; */
       transform: rotate(18888889996deg);
      
      }
      #one{
        background-color: blueviolet;
        transition-timing-function:ease-in ;
      }
       #two{
        background-color: rgb(31, 198, 224);
           transition-timing-function:ease-out ;
      } #three{
        background-color: rgb(57, 176, 44); 
          transition-timing-function:ease-in-out ;
      } 
      #four{
        background-color: rgb(189, 73, 193);
      }
       #five{
        background-color: rgb(214, 23, 23); 
      }
     
    </style>
</head>

<body>

  <div id="parent">  
       <div id="one" class="oo"></div>
       <div id="two"class="oo"></div>
       <div id="three"class="oo"></div>
       <div id="four"class="oo"></div>
       <div id="five"class="oo"></div>
   </div> 

</body>

</html>
