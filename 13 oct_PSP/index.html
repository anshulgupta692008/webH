<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .card{
            margin: 100px,auto;
            width: 90%;
            border:4px solid;
            display: flex;
            overflow: hidden;
        }
        .track{
             display:flex ;
             animation: scroll 12s linear infinite;
        }
        .parent{
            display: flex;
            align-items: center;
            justify-content: center;
            gap:1em;
            padding-right: 20px;
        }
        .oo{
            width: 400px;
            height: 30vh;
            padding:2vh;
            background: rgb(88,218,230);
            border-radius: 5px;
            text-align: center;
            border:2px solid rgb(248,246,246);
        }
        @keyframes scroll {
            from{
                transform: translateX(0%);
            }
            to{
                transform: translateX(-50%);
            }
        }
        .card:hover.track{
            animation-play-state: pause;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="track">
    <div class="parent">
        <div class="oo">1</div>
        <div class="oo">2</div>
        <div class="oo">3</div>
        <div class="oo">4</div>
        <div class="oo">5</div>
        <div class="oo">6</div>
    </div>
    <div class="parent">
        <div class="oo">1</div>
        <div class="oo">2</div>
        <div class="oo">3</div>
        <div class="oo">4</div>
        <div class="oo">5</div>
        <div class="oo">6</div>
    </div>

    </div>
    </div>
</body>
</html>
