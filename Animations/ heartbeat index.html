<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        .oo{
            animation-name:anm;
            animation-duration: 0.8s;
         animation-iteration-count:infinite ;
         animation-timing-function:ease-in;
         animation-direction: alternate;
          display: flex;
            justify-content: center;
        }
         @keyframes anm{
            0%{
                transform: translateY(0) scale(1);
                obacity:0.5;
            }
             50%{
                transform: translateY(0) scale(1.3);
                obacity:1;
            }100%{
                transform: translateY(0) scale(1);
                obacity:0;
            }
        }
    </style>
</head>

<body bgcolor="black">
     <center>
    <div class="oo">
       <img src="https://images.stockcake.com/public/2/9/7/29783f4f-8236-4ad4-a78f-c054e51a1793_large/human-heart-model-stockcake.jpg"
            alt="">
    </div>
    </center>
</body>

</html>
